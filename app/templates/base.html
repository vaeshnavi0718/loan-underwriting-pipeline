<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Loan Underwriting Pipeline{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e4e9;
      --text: #16181d;
      --text-muted: #6b7280;
      --primary: #2952cc;
      --primary-hover: #223f9e;
      --danger: #c0392b;
      --danger-hover: #9c2d21;
      --warn: #b7791f;
      --warn-hover: #935e18;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #12141c;
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a.brand { color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
    header a.brand::before { content: "◆ "; color: #6d8dff; }
    main { max-width: 920px; margin: 32px auto; padding: 0 20px 60px; }
    .banner {
      background: #fbf6e5; border: 1px solid #e9dfb0; color: #7a6420;
      padding: 10px 14px; border-radius: var(--radius); font-size: 12.5px; margin-bottom: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.2px; }
    h2 { font-size: 14px; font-weight: 650; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.4px; color: #333; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin: 14px 0 5px; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #d5d7de; border-radius: 7px;
      box-sizing: border-box; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(41,82,204,0.12); }
    input[type=file] { font-size: 13px; margin-top: 2px; }
    button, .btn {
      background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 7px;
      font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
      transition: background 0.12s ease;
    }
    button:hover, .btn:hover { background: var(--primary-hover); }
    button.deny { background: var(--danger); } button.deny:hover { background: var(--danger-hover); }
    button.info { background: var(--warn); } button.info:hover { background: var(--warn-hover); }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #f5f6f8; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid #eef0f3; }
    th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.3px; text-transform: uppercase;
    }
    .badge-CREATED, .badge-IN_PROGRESS { background: #e8edfd; color: #2952cc; }
    .badge-NEEDS_DOCUMENTATION { background: #fdf1de; color: #b7791f; }
    .badge-AWAITING_HUMAN_DECISION { background: #efe7fb; color: #6d3fc2; }
    .badge-APPROVED { background: #e1f6ea; color: #1a8a4c; }
    .badge-DENIED { background: #fbe6e3; color: #c0392b; }
    .badge-ERROR { background: #fbe6e3; color: #7f1d1d; }
    .badge-low { background: #e1f6ea; color: #1a8a4c; }
    .badge-moderate { background: #fdf1de; color: #b7791f; }
    .badge-high, .badge-critical { background: #fbe6e3; color: #c0392b; }
    .badge-unknown { background: #eef0f3; color: #6b7280; }
    .muted { color: var(--text-muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    ul.findings { margin: 0; padding-left: 18px; }
    ul.findings li { margin-bottom: 6px; font-size: 13.5px; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .field-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f1f2f5; font-size: 13.5px; }
    .field-row:last-child { border-bottom: none; }
    .field-row .k { color: var(--text-muted); }
    .field-row .v { font-weight: 600; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } main { padding: 0 14px 40px; } }
  </style>
</head>
<body>
  <header><a class="brand" href="/">Loan Underwriting Pipeline</a></header>
  <main>
    <div class="banner">Synthetic data only — no real applicant, credit bureau, employment, or banking data is used anywhere in this demo.</div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
