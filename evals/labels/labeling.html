<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}

.report h3{margin:14px 0 4px;font-size:.95rem}.report p,.report li{line-height:1.5}.report ul{margin:4px 0;padding-left:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}

.yes{background:var(--yes)}.no{background:var(--no)}.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
textarea{width:100%;margin-top:10px;border-radius:10px;border:1px solid var(--line);padding:8px;font:inherit;background:var(--card);color:var(--ink)}

ainst the uncertainty around actual income and cashflow when making a final decision."}}, {"n": 20, "case_id": "APP-003", "kind": "claims", "item": "An income or deposit mismatch", "report": {"summary": "Casey Nolan is applying for a $10,000 auto\u2011repair loan with full\u2011time employment and a verified identity, but the credit profile and cash\u2011flow analysis raise significant concerns.", "key_findings": ["Credit score is 571, placed in the critical band with two payments over 30 days late in the past year", "Debt\u2011to\u2011income ratio is low at 18\u202f% (monthly debt $780 vs gross income $4,300)", "Cash\u2011flow stability is assessed as low, resulting in a high cash\u2011flow risk rating", "Employment is verified full\u2011time at Riverstone Retail with a gross monthly income of $4,300", "Requested loan amount represents about 19\u202f% of annual income"], "inconsistencies": [], "risk_explanation": "The applicant\u2019s credit score and recent late payments indicate a high likelihood of future payment problems, which drives the overall risk to a critical level. While the debt\u2011to\u2011income ratio looks comfortable, the bank\u2011statement analysis shows limited cash reserves and low stability, meaning there is little buffer for unexpected expenses. Employment is stable and verified, which is a positive factor, but it does not offset the credit and cash\u2011flow weaknesses.", "narrative_report": "Underwriting Review Report\n\nApplicant: Casey Nolan\nApplication ID: EVAL-APP-003-A4810D\nRequested Amount: $10,000\nPurpose: Auto repair\n\nKey Findings\n- Credit profile: Score of 571 (critical band) with two payments more than 30 days late in the last 12 months.\n- Debt\u2011to\u2011income: 18\u202f% (monthly debt $780 / gross monthly income $4,300), which falls in the low\u2011risk band.\n- Cash\u2011flow analysis: Average monthly bank balance $1,300 against monthly deposits $4,250, resulting in a low stability rating and a high cash\u2011flow risk const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function save(){ try { localStorage.setItem("judgeLabels", JSON.stringify(answers)); } catch (e) {} }
function render(){
  document.getElementById("prog").style.width = (Object.keys(answers).length / ITEMS.length * 100) + "%";

    app.innerHTML = `<div class="card"><p class="q">All ${ITEMS.length} done. Thank you!</p>
      <p>Click below to save your answers; the file goes to your Downloads folder as <b>my_judge_labels.json</b>.</p>
      <button class="yes" id="dl">Save my answers</button> <button class="ghost" id="back2">Back to review</button></div>`;
    document.getElementById("dl").onclick = () => { const a = document.createElement("a");

    document.getElementById("back2").onclick = () => { i = ITEMS.length - 1; render(); };
    return;
  }
  const it = ITEMS[i], r = it.report;
  const q = it.kind === "states"
    ? `Does the report state this? <br>“${esc(it.item)}”<small>Wording, rounding and formatting may differ, but the substance must be there.</small>`
    : `Does the report claim this? <br>“${esc(it.item)}”<small>Mentioning the topic only to rule it out (e.g. “no inconsistencies were found”) doesn't count as claiming it.</small>`;
  const list = xs => xs && xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">(empty)</p>`;
  app.innerHTML = `<div class="card"><span class="tag">${i + 1} of ${ITEMS.length}</span><span class="tag">${esc(it.case_id)}</span>
      <p class="q">${q}</p></div>

function pick(label){ answers[ITEMS[i].n] = {label, note: document.getElementById("note")?.value || ""}; save(); i++; render(); }
function back(){ if (i > 0) { i--; render(); } }
