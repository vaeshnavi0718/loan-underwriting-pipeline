# Expected behavior for each synthetic application.
#
# expected_status   where the pipeline should stop. Applications missing a
#                   required document pause before the Review Agent runs.
# must_mention      facts the report has to surface clearly. Graded by an
#                   LLM judge that must quote the supporting text. Write
#                   checkable content (numbers, events), not adjectives:
#                   "Fair credit score of 648" failed a report that said
#                   "648 (sub-prime)", though the fact was there.
# must_not_claim    things the report must NOT say. These catch false alarms
#                   and known misreadings seen in real runs.
#
# Rules that apply to every report (no approve/deny recommendation, no
# invented numbers) live in the graders, not here.

- id: APP-001
  scenario: Strong applicant (clean control)
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Credit score of 782 with no late payments
    - Low debt-to-income ratio (about 9%)
  must_not_claim:
    - Any inconsistency or discrepancy between the documents
    - An income or deposit mismatch
    - A problem with the applicant's identity or ID document

- id: APP-002
  scenario: High debt-to-income
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - High debt-to-income ratio (about 56%, $2,850 debt on $5,100 income)
    - Low cash reserves or cash-flow stability (average balance $2,100 against $5,050 monthly deposits)
  must_not_claim:
    - An income or deposit mismatch
    - A problem with the applicant's identity or ID document

- id: APP-003
  scenario: Low credit score
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Credit score of 571
    - Two payments 30+ days late in the last 12 months
  must_not_claim:
    - An income or deposit mismatch
    - A problem with the applicant's identity or ID document

- id: APP-004
  scenario: Missing bank statement
  expected_status: NEEDS_DOCUMENTATION
  expected_missing: [bank_statement]

- id: APP-005
  scenario: Income discrepancy
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Stated income ($8,000/month) is far above observed bank deposits ($3,100/month)
  must_not_claim:
    - A problem with the applicant's identity or ID document

- id: APP-006
  scenario: Unverified ID document
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - The ID document could not be verified
  must_not_claim:
    - An income or deposit mismatch

- id: APP-007
  scenario: Borderline, needs manual review
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Credit score of 648 with one late payment in the last 12 months
    - Moderate debt-to-income ratio (about 34%)
    - Low cash reserves or cash-flow stability (average balance $2,600 against $5,550 monthly deposits)
  must_not_claim:
    - An income or deposit mismatch
    - A problem with the applicant's identity or ID document

- id: APP-008
  scenario: Self-employed, volatile cash flow
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Applicant is self-employed
    - Stated income ($6,200/month) is well above observed deposits ($3,900/month)
  must_not_claim:
    # Seen in a real run on 2026-10-19: the model read the income_stability
    # risk band "high" (high risk) as "high stability" and reported a
    # contradiction with the cash-flow rating that does not exist.
    - Income stability is high or strong, or that it conflicts with the cash-flow rating
    - A problem with the applicant's identity or ID document

- id: APP-009
  scenario: Large loan relative to income
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - Requested loan ($60,000) equals about 100% of annual income ($60,000)
  must_not_claim:
    - An income or deposit mismatch
    - A problem with the applicant's identity or ID document

- id: APP-010
  scenario: Thin credit file, young applicant
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    - No credit score on file (thin credit file)
    - Part-time employment
  must_not_claim:
    # Born 2003, so an adult. Guards against over-applying the APP-012 pattern.
    - The applicant is a minor or under 18
    - An income or deposit mismatch

- id: APP-011
  scenario: Unemployed, no pay stub
  expected_status: NEEDS_DOCUMENTATION
  expected_missing: [pay_stub]

- id: APP-012
  scenario: ID shows the applicant is a minor
  expected_status: AWAITING_HUMAN_DECISION
  must_mention:
    # No rule-based agent checks age, so only the Review Agent can catch this.
    - Date of birth (2010-04-22) means the applicant is about 16, a minor
  must_not_claim:
    - An income or deposit mismatch
