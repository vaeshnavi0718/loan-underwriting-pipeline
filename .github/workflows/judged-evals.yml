name: Judged evals

# Manual only: these suites call the LLM (the Review Agent and the judge) on
# the Groq free tier, which has a daily token limit. Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [judged, injection_judged]
        default: judged
      repeats:
        description: "Runs per application (fresh runs only)"
        type: number
        default: 1
      from_results:
        description: "Optional: re-grade a saved results file instead of running the pipeline, e.g. evals/results/2026-10-21T115125Z_review.json"
        type: string
        default: ""
      cases:
        description: "Optional: only these case ids, space-separated, e.g. APP-005 APP-008 (saves quota)"
        type: string
        default: ""

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the API key is set
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Run ${{ inputs.suite }}
        env:
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          FROM_RESULTS: ${{ inputs.from_results }}
          CASES: ${{ inputs.cases }}
        run: |
          args=(--suite "$SUITE")
          if [ -n "$FROM_RESULTS" ]; then args+=(--from-results "$FROM_RESULTS"); else args+=(--repeats "$REPEATS"); fi
          if [ -n "$CASES" ]; then read -ra ids <<< "$CASES"; args+=(--cases "${ids[@]}"); fi
          set -o pipefail
          python -m evals.run "${args[@]}" | tee eval_output.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat eval_output.txt 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # the run prints "-> <file>" last; upload only this run's file, not the committed ones
          echo "RESULT_FILE=$(sed -n 's/^-> //p' eval_output.txt 2>/dev/null | tail -1)" >> "$GITHUB_ENV"
      - name: Upload raw results
        if: always() && env.RESULT_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-results
          path: ${{ env.RESULT_FILE }}
