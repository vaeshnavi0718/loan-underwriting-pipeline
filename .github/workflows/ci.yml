name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No key in CI: the Review Agent uses its deterministic fallback report,
      # so tests and code-graded evals are free and repeatable.
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and pipeline tests
        run: pytest -v
      - name: Code-graded evals
        run: python -m evals.run --suite review
